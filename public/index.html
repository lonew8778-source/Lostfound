<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LostFound الجزائر</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7f9;
      color: #17202a;
      overflow-x: hidden;
      overflow-y: auto;
    }

    main {
      min-height: auto;
      padding-bottom: 30px;
    }

    .topbar {
      background: #0b5d4b;
      color: white;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: white;
      color: #0b5d4b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .brand-text strong {
      display: block;
      font-size: 19px;
    }

    .brand-text span {
      font-size: 12px;
      opacity: .85;
    }

    #menuBtn {
      border: 0;
      background: rgba(255,255,255,.15);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 24px;
      cursor: pointer;
    }

    .hero {
      margin: 18px;
      padding: 24px 20px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 25px;
      color: #0b5d4b;
    }

    .hero p {
      margin: 0;
      line-height: 1.7;
      color: #66727c;
    }

    .main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .main-action {
      border: 0;
      padding: 18px 10px;
      border-radius: 17px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #eef7f4;
      color: #0b5d4b;
    }

    .main-action .icon {
      display: block;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .section-title {
      margin: 25px 18px 12px;
      font-size: 19px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 18px;
    }

    .service {
      border: 0;
      background: white;
      padding: 17px 10px;
      border-radius: 17px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      cursor: pointer;
      font-size: 14px;
      color: #27343b;
    }

    .service .icon {
      display: block;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .badge {
      display: none;
      background: #d62828;
      color: white;
      border-radius: 20px;
      padding: 2px 7px;
      font-size: 11px;
      margin-right: 4px;
    }

    #form-area {
      display: none;
    }

    #form-area:not(:empty) {
      display: block;
      position: fixed;
      z-index: 9998;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 32px);
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      margin: 0;
      padding: 24px 18px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow:
        0 10px 35px rgba(0,0,0,.25),
        0 0 0 100vmax rgba(0,0,0,.55);
    }

    #form-area input,
    #form-area textarea,
    #form-area button {
      max-width: 100%;
    }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 2000;
    }

    .menu-panel {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: min(320px, 88%);
      background: white;
      padding: 20px;
      overflow-y: auto;
    }

    .menu-panel h2 {
      margin-top: 5px;
      color: #0b5d4b;
    }

    .menu-panel button {
      display: block;
      width: 100%;
      border: 0;
      background: #f3f6f7;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      text-align: right;
      font-size: 15px;
      cursor: pointer;
    }

    .close-menu {
      background: #ffecec !important;
      color: #b42318;
    }

    footer {
      text-align: center;
      color: #89949b;
      padding: 30px 15px;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .hero,
      .services,
      .section-title {
        max-width: 850px;
        margin-left: auto;
        margin-right: auto;
      }

      .services {
        grid-template-columns: repeat(4, 1fr);
      }

      .main-actions {
        grid-template-columns: 1fr 1fr;
      }
    }
  
      #closeFormArea {
        display: none;
        position: fixed;
        top: calc(50% - 40vh + 8px);
        right: max(16px, calc(50% - 300px));
        z-index: 10000;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: #b42318;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,.25);
      }

      #form-area:not(:empty) + #closeFormArea {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #closeFormArea:active {
        transform: scale(.94);
      }

    </style>

<style>
.info-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.55);
  padding: 20px;
  overflow-y: auto;
}

.info-panel {
  width: 100%;
  max-width: 600px;
  margin: 40px auto;
  background: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-sizing: border-box;
  position: relative;
  box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.close-info {
  position: absolute;
  top: 12px;
  left: 12px;
  border: none;
  background: #f1f1f1;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 18px;
  cursor: pointer;
}

#infoContent {
  padding-top: 35px;
  line-height: 1.9;
  color: #222;
}

#infoContent h2 {
  color: #0b5d4b;
  margin-top: 0;
}

#infoContent h3 {
  color: #0b5d4b;
}
</style>

</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="brand-icon">🔎</div>

    <div class="brand-text">
      <strong>LostFound الجزائر</strong>
      <span>منصة الممتلكات والوثائق الضائعة</span>
    </div>
  </div>

  <button id="menuBtn" type="button">☰</button>

</header>

<main>

  <section class="hero">

    <h1>أهلاً بك في LostFound الجزائر</h1>

    <p>
      ساعد في إعادة الممتلكات والوثائق الضائعة إلى أصحابها.
      أبلغ عن شيء فقدته أو عثرت عليه وابحث عن المطابقات بسهولة.
    </p>

    <div class="main-actions">

      <button id="lostBtn" class="main-action" type="button">
        <span class="icon">🔴</span>
        أبلغ عن شيء ضائع
      </button>

      <button id="foundBtn" class="main-action" type="button">
        <span class="icon">🟢</span>
        أبلغ عن شيء وجدته
      </button>

    </div>

  </section>

  <h2 class="section-title">الخدمات</h2>

  <section class="services">

    <button id="reportsBtn" class="service" type="button">
      <span class="icon">🔎</span>
      البحث في البلاغات
    </button>

    <button id="myChatsBtn" class="service" type="button">
      <span class="icon">💬</span>
      محادثاتي
      <span id="myChatsBadge" class="badge">0</span>
    </button>

    <button id="contactRequestsBtn" class="service" type="button">
      <span class="icon">🔔</span>
      طلبات التواصل
      <span id="contactRequestsBadge" class="badge">0</span>
    </button>

    <button id="myContactRequestsBtn" class="service" type="button">
      <span class="icon">📨</span>
      طلباتي
      <span id="myContactRequestsBadge" class="badge">0</span>
    </button>

    <button id="loginBtn" class="service" type="button">
      <span class="icon">🔐</span>
      تسجيل الدخول
    </button>


    <button id="supportContactBtn" class="service" type="button">
      <span class="icon">📧</span>
      تواصل معنا
    </button>
    <button id="registerBtn" class="service" type="button">
      <span class="icon">👤</span>
      إنشاء حساب
    </button>

    <button id="logoutBtn" class="service" type="button" style="display:none;">
      <span class="icon">🚪</span>
      تسجيل الخروج
    </button>

  </section>

  <div id="form-area"></div>
  <button id="closeFormArea" type="button" aria-label="إغلاق">✕</button>

</main>

<footer>
  LostFound الجزائر © 2026
</footer>

<!-- نافذة المعلومات -->
<div id="infoOverlay" class="info-overlay" style="display:none;">
  <div class="info-panel">
    <button id="closeInfoBtn" class="close-info" type="button">✕</button>
    <div id="infoContent"></div>
  </div>
</div>

<!-- القائمة الجانبية -->
<div id="menuOverlay" class="menu-overlay">

  <div class="menu-panel">

    <h2>القائمة</h2>

    <button id="menuLostBtn" type="button">🔴 الإبلاغ عن شيء ضائع</button>

    <button id="menuFoundBtn" type="button">🟢 الإبلاغ عن شيء وجدته</button>

    <button id="menuReportsBtn" type="button">🔎 البحث في البلاغات</button>

    <button id="menuChatsBtn" type="button">💬 محادثاتي</button>

    <button id="menuContactBtn" type="button">🔔 طلبات التواصل</button>

    <button id="menuMyRequestsBtn" type="button">📨 طلباتي</button>

    <button id="menuLoginBtn" type="button">🔐 تسجيل الدخول</button>

    <button id="menuRegisterBtn" type="button">👤 إنشاء حساب</button>
    <button id="menuAboutBtn" type="button">ℹ️ من نحن</button>
    <button id="menuTermsBtn" type="button">📜 شروط الاستخدام</button>
      <button id="menuPrivacyBtn" type="button">🔒 سياسة الخصوصية</button>

    <button id="closeMenuBtn" class="close-menu" type="button">✕ إغلاق القائمة</button>

  </div>

</div>

<script src="/app.js?v=3" defer></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("menuOverlay");
    const closeBtn = document.getElementById("closeMenuBtn");

    function openMenu() {
      overlay.style.display = "block";
    }

    function closeMenu() {
      overlay.style.display = "none";
    }

    menuBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) {
        closeMenu();
      }
    });

    const links = {
      menuLostBtn: "lostBtn",
      menuFoundBtn: "foundBtn",
      menuReportsBtn: "reportsBtn",
      menuChatsBtn: "myChatsBtn",
      menuContactBtn: "contactRequestsBtn",
      menuMyRequestsBtn: "myContactRequestsBtn",
      menuLoginBtn: "loginBtn",
      menuRegisterBtn: "registerBtn"
    };

    Object.keys(links).forEach(function (menuId) {

      const menuElement = document.getElementById(menuId);
      const targetId = links[menuId];

      menuElement.addEventListener("click", function () {

        closeMenu();

        const target = document.getElementById(targetId);

        if (target) {
          target.click();
        }

      });

    });

  });
</script>

</body>
</html>
